<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="title">
  <title id="title">Conceito de landing page Flora</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3f0c09"/><stop offset=".55" stop-color="#74140f"/><stop offset="1" stop-color="#170706"/></linearGradient><linearGradient id="petal"><stop stop-color="#ffc247"/><stop offset=".6" stop-color="#ff9f0a"/><stop offset="1" stop-color="#e10600"/></linearGradient></defs>
  <rect width="1200" height="1000" fill="url(#bg)"/><circle cx="960" cy="510" r="330" fill="#e10600" opacity=".5"/><circle cx="1010" cy="530" r="230" fill="url(#petal)"/><circle cx="920" cy="430" r="120" fill="#ff2a1a"/>
  <text x="75" y="105" fill="#fff3df" font-family="Georgia" font-size="58" font-weight="700">flora.</text><g fill="#fff3df" font-family="Arial" font-size="15"><text x="780" y="92">CUIDADO</text><text x="900" y="92">ESPECIALIDADES</text><text x="1050" y="92">CONTATO</text></g>
  <text x="75" y="300" fill="#ffc247" font-family="Arial" font-size="15" letter-spacing="5">SAUDE E BEM-ESTAR</text><text x="72" y="405" fill="#fff3df" font-family="Georgia" font-size="92" font-weight="700">Cuidado</text><text x="72" y="495" fill="#ffc247" font-family="Georgia" font-size="92" font-style="italic">que floresce.</text><text x="78" y="560" fill="#f0cfc8" font-family="Arial" font-size="21">Atendimento humano em cada etapa da sua jornada.</text><rect x="76" y="620" width="230" height="62" rx="31" fill="#e10600"/><text x="112" y="658" fill="#fff" font-family="Arial" font-size="16" font-weight="800">AGENDAR CONVERSA</text>
  <g transform="translate(76 800)"><rect width="830" height="110" rx="22" fill="#15171c"/><text x="35" y="45" fill="#ffc247" font-family="Arial" font-size="14">ACOLHIMENTO</text><text x="35" y="78" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Escuta, clareza e cuidado integral.</text></g>
</svg>
