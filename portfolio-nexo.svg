  <rect width="1200" height="1000" fill="url(#bg)"/><g opacity=".15" stroke="#ff2a1a"><path d="M0 100h1200M0 200h1200M0 300h1200M0 400h1200M0 500h1200M0 600h1200M0 700h1200M0 800h1200M0 900h1200"/><path d="M100 0v1000M200 0v1000M300 0v1000M400 0v1000M500 0v1000M600 0v1000M700 0v1000M800 0v1000M900 0v1000M1000 0v1000M1100 0v1000"/></g>
